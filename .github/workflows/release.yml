name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: npm run check
      - run: npm pack
      - run: sha256sum *.tgz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
